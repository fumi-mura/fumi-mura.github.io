<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ストア遷移の検証</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    line-height: 1.7;
    padding: 20px 16px 48px;
    max-width: 520px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; }
  .note { margin-top: 8px; font-size: 14px; opacity: 0.75; }
  ol { margin-top: 24px; list-style: none; }
  li { margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(128, 128, 128, 0.3); }
  .label { font-size: 14px; font-weight: 700; }
  .href {
    margin-top: 4px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    opacity: 0.6;
    word-break: break-all;
  }
  .try {
    display: block;
    margin-top: 10px;
    padding: 14px;
    border-radius: 10px;
    background: #2f7dce;
    color: #fff;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
  }
  .mark { display: flex; gap: 8px; margin-top: 8px; }
  .mark button {
    flex: 1;
    padding: 10px;
    border: 1px solid rgba(128, 128, 128, 0.5);
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 14px;
  }
  .mark button[aria-pressed="true"] { background: #2f7dce; border-color: #2f7dce; color: #fff; }
  .result { margin-top: 32px; }
  textarea {
    width: 100%;
    height: 150px;
    margin-top: 8px;
    padding: 10px;
    border: 1px solid rgba(128, 128, 128, 0.5);
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font-family: ui-monospace, monospace;
    font-size: 12px;
  }
</style>
</head>
<body>
  <h1>ストア遷移の検証</h1>
  <p class="note">
    Instagram のアプリ内ブラウザで開いて、上から順にボタンを押してください。
    ストアが開いたら戻ってきて「飛べた」を押します。何も起きなければ「反応なし」です。
  </p>

  <ol id="cases"></ol>

  <div class="result">
    <strong>結果</strong>
    <textarea id="out" readonly></textarea>
  </div>

<script>
  const APP = "apps.apple.com/jp/app/id6792999094?pt=94214112&ct=yomoka-1.3.1-square&mt=8";
  const HTTPS = "https://" + APP;

  const CASES = [
    { id: "https", label: "1. https 直リンク（対照群）", href: HTTPS },
    { id: "itms", label: "2. itms-apps:// を直接タップ", href: "itms-apps://" + APP },
    { id: "itmss", label: "3. itms-appss:// を直接タップ", href: "itms-appss://" + APP },
    { id: "blank", label: "4. https + target=\"_blank\"", href: HTTPS, blank: true },
    { id: "jsloc", label: "5. JS で location.href に itms-apps://", js: () => { location.href = "itms-apps://" + APP; } },
    { id: "jsopen", label: "6. JS で window.open(https)", js: () => { window.open(HTTPS, "_blank"); } },
  ];

  const store = JSON.parse(localStorage.getItem("storeTest") || "{}");
  const list = document.getElementById("cases");
  const out = document.getElementById("out");

  function render() {
    const lines = CASES.map((c) => `${c.label.padEnd(2)} → ${store[c.id] || "未"}`);
    out.value = lines.join("\n") + "\n\nUA: " + navigator.userAgent;
  }

  for (const c of CASES) {
    const li = document.createElement("li");

    const label = document.createElement("p");
    label.className = "label";
    label.textContent = c.label;
    li.append(label);

    const href = document.createElement("p");
    href.className = "href";
    href.textContent = c.href || "(JavaScript)";
    li.append(href);

    let trigger;
    if (c.js) {
      trigger = document.createElement("button");
      trigger.type = "button";
      trigger.addEventListener("click", c.js);
    } else {
      trigger = document.createElement("a");
      trigger.href = c.href;
      if (c.blank) {
        trigger.target = "_blank";
        trigger.rel = "noopener";
      }
    }
    trigger.className = "try";
    trigger.textContent = "試す";
    li.append(trigger);

    const mark = document.createElement("div");
    mark.className = "mark";
    for (const verdict of ["飛べた", "反応なし"]) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = verdict;
      button.setAttribute("aria-pressed", String(store[c.id] === verdict));
      button.addEventListener("click", () => {
        store[c.id] = verdict;
        localStorage.setItem("storeTest", JSON.stringify(store));
        for (const sibling of mark.children) {
          sibling.setAttribute("aria-pressed", String(sibling.textContent === verdict));
        }
        render();
      });
      mark.append(button);
    }
    li.append(mark);

    list.append(li);
  }

  render();
</script>
</body>
</html>
